apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: longhorn-system
type: Opaque
data:
  auth: generate using `echo -n "<USERNAME_HERE>:$(openssl passwd -apr1 <<< "<PASSWORD_HERE>")" | base64`
  users: same value as `auth` (traefik reads the `users` key, ingress-nginx reads `auth`)