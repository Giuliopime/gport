grafana:
  existingSecret: grafana-admin
  envFromSecrets:
    - name: grafana-alerting
      optional: true
  grafana.ini:
    server:
      root_url: https://grafana.giuliopime.dev
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Infrastructure
      provider:
        foldersFromFilesStructure: true
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
      searchNamespace: ALL
  service:
    type: ClusterIP
  admin:
    existingSecret: "grafana-admin"
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    hosts:
      - grafana.giuliopime.dev
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    tls:
      - hosts:
          - grafana.giuliopime.dev
        secretName: grafana-tls

prometheus:
  prometheusSpec:
    enableOTLPReceiver: true
    retention: 10d
    retentionSize: 9GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn 
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi


# k3s runs these inside a single process and does not expose their metrics endpoints, so their "down" alerts always fire
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
