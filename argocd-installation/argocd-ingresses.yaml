apiVersion: v1
kind: Service
metadata:
  name: argocd-server-grpc
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: grpc
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-http-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod-dns"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
      host: argocd.giuliopime.dev
  tls:
    - hosts:
        - argocd.giuliopime.dev
      secretName: argocd-ingress-http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-grpc-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod-dns"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server-grpc
                port:
                  name: grpc
      host: grpc.argocd.giuliopime.dev
  tls:
    - hosts:
        - grpc.argocd.giuliopime.dev
      secretName: argocd-ingress-grpc
