apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: 'https://github.com/Giuliopime/gport.git'
      targetRevision: main
      ref: gportrepo
      path: k8s-resources/redis
      directory:
        exclude: "secrets/*"
    - repoURL: 'https://charts.bitnami.com/bitnami'
      targetRevision: 22.0.7
      chart: redis
      helm:
        valueFiles:
          - $gportrepo/k8s-resources/redis/values.yaml